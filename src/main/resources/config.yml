# Messages use & colour codes.
settings:
  prefix: "&8[&cPvPBot&8] &7"
  spawn-distance: 8          # blocks in front of you where the bot appears
  mace-damage-multiplier: 0.7
  heal-player-on-start: true

# Kits are used by BOTH you and the bot. Item format: MATERIAL;amount;ENCHANT:level;...
# Enchant names are vanilla ids (protection, sharpness, density, wind_burst, mending ...)
kits:
  cpvp:
    helmet: "NETHERITE_HELMET;PROTECTION:4;UNBREAKING:3;MENDING:1"
    chestplate: "NETHERITE_CHESTPLATE;PROTECTION:4;UNBREAKING:3;MENDING:1"
    leggings: "NETHERITE_LEGGINGS;PROTECTION:4;UNBREAKING:3;MENDING:1"
    boots: "NETHERITE_BOOTS;PROTECTION:4;UNBREAKING:3;MENDING:1;FEATHER_FALLING:4"
    offhand: "TOTEM_OF_UNDYING"
    items:   # slot 0,1,2... (first item is the bot's weapon)
      - "NETHERITE_SWORD;1;SHARPNESS:5;UNBREAKING:3;MENDING:1"
      - "END_CRYSTAL;64"
      - "OBSIDIAN;64"
      - "ENCHANTED_GOLDEN_APPLE;16"
      - "TOTEM_OF_UNDYING"
      - "TOTEM_OF_UNDYING"
      - "ENDER_PEARL;16"
  mace:
    helmet: "NETHERITE_HELMET;PROTECTION:4;UNBREAKING:3;MENDING:1"
    chestplate: "NETHERITE_CHESTPLATE;PROTECTION:4;UNBREAKING:3;MENDING:1"
    leggings: "NETHERITE_LEGGINGS;PROTECTION:4;UNBREAKING:3;MENDING:1"
    boots: "NETHERITE_BOOTS;PROTECTION:4;UNBREAKING:3;MENDING:1;FEATHER_FALLING:4"
    offhand: "TOTEM_OF_UNDYING"
    items:
      - "MACE;1;DENSITY:5;WIND_BURST:3;UNBREAKING:3;MENDING:1"
      - "NETHERITE_SWORD;1;SHARPNESS:5;UNBREAKING:3"
      - "WIND_CHARGE;64"
      - "ENCHANTED_GOLDEN_APPLE;16"
      - "TOTEM_OF_UNDYING"
      - "TOTEM_OF_UNDYING"

# speed: bot move speed | attack: base melee dmg (weapon adds more) | reaction: ticks between
# crystal/mace attempts (lower = faster) | hit: chance an attempt lands | power: crystal explosion
# power | totems: bot totem pops | gapples: bot heals (+8 hp)
tiers:
  LT5: {speed: 0.21, attack: 1.0, reaction: 40, hit: 0.30, power: 2.5, totems: 0, gapples: 0}
  HT5: {speed: 0.22, attack: 1.0, reaction: 36, hit: 0.38, power: 3.0, totems: 0, gapples: 0}
  LT4: {speed: 0.23, attack: 1.0, reaction: 32, hit: 0.45, power: 3.3, totems: 0, gapples: 1}
  HT4: {speed: 0.24, attack: 1.0, reaction: 28, hit: 0.52, power: 3.6, totems: 1, gapples: 1}
  LT3: {speed: 0.25, attack: 1.0, reaction: 24, hit: 0.60, power: 4.0, totems: 1, gapples: 2}
  HT3: {speed: 0.26, attack: 1.0, reaction: 20, hit: 0.68, power: 4.4, totems: 1, gapples: 2}
  LT2: {speed: 0.27, attack: 1.5, reaction: 16, hit: 0.75, power: 4.8, totems: 2, gapples: 3}
  HT2: {speed: 0.28, attack: 1.5, reaction: 14, hit: 0.82, power: 5.2, totems: 2, gapples: 3}
  LT1: {speed: 0.30, attack: 2.0, reaction: 12, hit: 0.90, power: 5.6, totems: 3, gapples: 4}
  HT1: {speed: 0.32, attack: 2.0, reaction: 10, hit: 0.96, power: 6.0, totems: 4, gapples: 5}
